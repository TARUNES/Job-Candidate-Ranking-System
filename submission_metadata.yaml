# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  We implement a two-stage hybrid ranking funnel. Stage 1 executes fast non-semantic filters (schema validation, honeypot detection, timeline overlap, and a TF-IDF coherence mismatch detector) to screen the 100K candidate pool. Candidates are pre-ranked by an additive non-semantic score (using experience, notice period, location, and platform trust signals), shortlisting the top 2000. Stage 2 embeds the shortlisted candidates using SentenceTransformer (all-MiniLM-L6-v2) for cosine similarity calculation. The final score blends semantic similarity (45%) and non-semantic heuristics (55%). Top 100 entries are sorted and generated with grounded reasoning justifications.

